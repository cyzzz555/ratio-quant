[project]
name = "quant-system"
version = "0.1.0"
description = "Quant System V1.2 research workspace, P1 in progress, live disabled"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pyarrow==23.0.1",
  "PyYAML==6.0.3",
  "uvicorn==0.41.0",
  "websockets==16.0",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.17,<2",
  "duckdb>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.5", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915"]
mac = [
    "pgserver==0.1.4 ; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = ["network: optional public network tests", "postgres: explicit isolated PostgreSQL integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

